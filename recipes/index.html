<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A recipe book website" />
    <link rel="stylesheet" href="styles/styles.css" />
    <script src="scripts/main.js"></script>

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RecipeBook" />
    <meta property="og:description" content="A recipe book website" />
    <meta property="og:url" content="Your URL" />
    <meta property="og:image" content="images/social-preview-image.png" />

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image" />
    <meta name="twitter:title" content="RecipeBook" />
    <meta name="twitter:description" content="A recipe book website" />
    <meta name="twitter:image" content="images/social-preview-image.png" />

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="images/favicon.ico" />

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />

    <title>Recipe Book</title>
  </head>
  <body>
    <header>
      <div id="title">
        <img src="images/recipe-book.png" alt="Recipe Book Logo" />
        <h1>RecipeBook</h1>
      </div>

      <div id="search-container">
        <input type="text" id="search-input" placeholder="Find a recipe" />
        <div class="vl"></div>
        <button id="search-button"><img src="images/search.svg" alt="Search Button" /></button>
      </div>

      <hr />
    </header>
    <main>
      <section class="recipe">
        <div class="image"><img src="images/apple-crisp.jpg" alt="Apple Crisp Pie" /></div>

        <div class="recipe-info">
          <div>
          <button class="tag">dessert</button>
          <h2>Apple Crisp</h2>

          <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star-empty">☆</span>
          </span>

          </div>

          <p class="hidden-on-phone">
            This apple crisp recipe is a simple yet delicious fall dessert that's great served warm
            with a scoop of vanilla ice cream.
          </p>
        </div>
      </section>
    </main>
    <footer>
      <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
        <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon" /></a>
        <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon" /></a>
        <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon" /></a>
      </div>

      <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons"
        >Recipe icons created by Freepik - Flaticon</a
      >
    </footer>
  </body>
</html>
