<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Character card project" />
    <link rel="stylesheet" href="styles/styles.css" />
    <script src="scripts/script.js" defer></script>
    <title>Character Card</title>



    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Character card project" />
    <meta property="og:description" content="A character card project for WDD131" />
    <meta property="og:url" content="https://yourURLofPage.here" />
    <meta property="og:image" content="images/cat.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Character card project" />
    <meta name="twitter:description" content="A character card project for WDD131" />
    <meta name="twitter:image" content="images/cat.jpg" />

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="images/favicon.ico" />

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/favicon.png" />



  </head>
  <body>
    <main>
      <div class="image-container"><img id="characterImage" /></div>
      <div class="name-container"><h1 id="characterName"></h1></div>
      <div class="stats-container">
        <p><strong>Class:</strong> <span id="characterClass"></span></p>
        <p><strong>Level:</strong> <span id="characterLevel"></span></p>
        <p><strong>Health:</strong> <span id="characterHealth"></span></p>
      </div>
      <div class="button-container">
        <button id="attacked">Attacked</button>
        <button id="levelUp">Level Up</button>
        <!-- The rubric and instructions were unclear about what the add participant feature was, so I made one up -->
        <button id="addParticipant">Add Participant</button>
      </div>
    </main>
  </body>
</html>
