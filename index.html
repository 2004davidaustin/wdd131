<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Site Lister</title>
  <style>
    body { font-family: system-ui, Arial; max-width: 720px; margin: 2rem; }
    button { margin-right: .5rem; }
    ul { margin-top: 1rem; padding-left: 1rem; }
    li small { color: #555; margin-left: .5rem; }
  </style>
</head>
<body>
  <h1>Site Lister</h1>
  <p>Pick a folder to list all .html files in that folder and in its one-level subfolders.</p>

  <div>
    <button id="pickDir">Choose folder (Directory Picker)</button>
    <button id="chooseFallback">Choose folder (Fallback)</button>
    <input id="fileInput" type="file" webkitdirectory multiple style="display:none" />
  </div>

  <ul id="siteList"><li><em>No folder chosen yet.</em></li></ul>

  <script>
    const siteList = document.getElementById('siteList');
    const pickDirBtn = document.getElementById('pickDir');
    const fallbackBtn = document.getElementById('chooseFallback');
    const fileInput = document.getElementById('fileInput');

    function isHtml(name) { return /\.(html?|HTML?)$/.test(name); }
    function stripExt(name) { return name.replace(/\.[^.]+$/, ''); }

    // Deduplicate by label (case-insensitive), prefer root file when conflict
    function dedupe(items) {
      const map = new Map();
      for (const it of items) {
        const key = it.label.toLowerCase();
        if (!map.has(key)) map.set(key, it);
        else {
          const existing = map.get(key);
          if (existing.path.includes('/') && !it.path.includes('/')) map.set(key, it);
        }
      }
      return Array.from(map.values()).sort((a,b) => a.label.localeCompare(b.label));
    }

    function render(items) {
      siteList.innerHTML = '';
      if (!items.length) {
        siteList.innerHTML = '<li><em>No sites found</em></li>';
        return;
      }
      for (const it of items) {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.textContent = it.label;
        a.href = it.path;         // relative link (works if this page is in the same folder)
        a.target = '_blank';
        li.appendChild(a);
        if (it.path.includes('/')) {
          const small = document.createElement('small');
          small.textContent = `(${it.path})`;
          li.appendChild(small);
        }
        siteList.appendChild(li);
      }
    }

    // Modern Directory Picker (Chrome/Edge)
    async function scanDir(handle) {
      const found = [];
      for await (const [name, entry] of handle.entries()) {
        if (entry.kind === 'file') {
          if (isHtml(name)) found.push({ path: name, label: stripExt(name) });
        } else if (entry.kind === 'directory') {
          // one-level deep only
          for await (const [subName, subEntry] of entry.entries()) {
            if (subEntry.kind === 'file' && isHtml(subName)) {
              found.push({ path: `${name}/${subName}`, label: stripExt(subName) });
            }
          }
        }
      }
      return dedupe(found);
    }

    // Fallback using <input webkitdirectory>
    function scanFileList(files) {
      const found = [];
      for (const f of files) {
        if (!isHtml(f.name)) continue;
        const rel = f.webkitRelativePath || f.name;
        const parts = rel.split('/');
        if (parts.length === 1) {
          found.push({ path: parts[0], label: stripExt(parts[0]) });
        } else if (parts.length === 2) {
          // one-level subfolder only
          found.push({ path: rel, label: stripExt(parts[1]) });
        }
        // deeper levels ignored
      }
      return dedupe(found);
    }

    pickDirBtn.addEventListener('click', async () => {
      if (!window.showDirectoryPicker) {
        alert('Directory Picker not supported in this browser. Use the fallback button.');
        return;
      }
      try {
        const dir = await window.showDirectoryPicker();
        const list = await scanDir(dir);
        render(list);
      } catch (err) {
        // user cancelled or error
      }
    });

    fallbackBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const list = scanFileList(Array.from(e.target.files));
      render(list);
    });
  </script>
</body>
</html>
